# 768-hidden RWKV-7 hybrid for 6GB VRAM (RADLADS compressed from 1B)
n_layers: 32
hidden_size: 768
num_heads: 12          # 768 / HEAD_SIZE(64) = 12
expansion: 4
head_size: 64
norm_eps: 1e-6
half_layers: True      # → 16 layers per stack
H_cycles: 2
L_cycles: 3
bp_warmup_ratio: 0.2
bp_min_steps: 2
bp_max_steps: 5
